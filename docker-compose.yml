services:
  cythe-navigation:
    build: .
    image: cythe-navigation:latest
    container_name: ${CONTAINER_NAME:-cythe-navigation}
    restart: always
    ports:
      - "${CYTHE_HTTP_PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      # 可选：首次启动自动创建管理员；不设置则第一个注册用户成为管理员
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
